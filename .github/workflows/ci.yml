name: CI

on:
  pull_request:
  push:
    branches: ["**"]

env:
  CF_SEND_TELEMETRY: "false"
  CI: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build, deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx cf workers types
      - run: npm run typecheck
      - run: npm test
      - run: npx cf build
      - name: Deploy dry run
        run: npx cf deploy --prebuilt --mode production --dry-run
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

  e2e:
    name: Playwright, offline and bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx cf workers types
      - run: npx playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      - run: npm run db:migrate:local
      - name: Onboarding e2e (dev server)
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Start production preview
        run: |
          npm run start > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "preview did not come up"; cat preview.log; exit 1
      - name: Offline e2e (production preview)
        run: npx playwright test e2e/offline.spec.ts
        env:
          BASE_URL: http://localhost:3001
      - name: Bundle budget
        run: npm run check:bundle
        env:
          BASE_URL: http://localhost:3001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            preview.log
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx cf workers types
      - run: npx cf build
      # Remote D1 migrations are applied by a person (npm run db:migrate:remote) until the
      # first deploy has proven the token scopes; the API falls back to the bundled seed meanwhile.
      - run: npx cf deploy --prebuilt --mode production
