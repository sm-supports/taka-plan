name: CI

# GitHub Actions only checks the code. Deploys are done by Cloudflare Pages itself: the Pages
# project is connected to this repository and builds every push (main = production, other
# branches = preview). See docs/DEPLOY.md.
on:
  pull_request:
  push:
    branches: [main]

env:
  CI: "1"
  WRANGLER_SEND_METRICS: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, static export, Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # vite build + scripts/check-export.mjs (fails if any page dropped out of the export).
      - run: npm run build
      - name: Pages Functions compile
        run: npx wrangler pages functions build --outdir "$RUNNER_TEMP/functions-out"

  e2e:
    name: Playwright on the Pages runtime, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      - run: npm run db:migrate:local
      - run: npm run build
      - name: Start the Pages preview (static export + Functions + local D1)
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8788/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "preview did not come up"; cat preview.log; exit 1
      - run: npm run smoke
      - run: npx playwright test
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            preview.log
          if-no-files-found: ignore
          retention-days: 7
